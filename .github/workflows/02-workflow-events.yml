name: 02 - workflow Events
on:
    push:
        branches:
        - main
    pull_request:
        types: [opened, synchronize, reopened]
    issues:
        types: [opened, edited, closed]
    schedule:
        - cron: '0 0 * * *'
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow is triggered by ${{ github.event_name }} event"
